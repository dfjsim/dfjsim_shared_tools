[build-system]
    # 77 is the first setuptools that reads an SPDX expression in `license` and `license-files` (PEP 639).
    requires      = ["setuptools>=77"]
    build-backend = "setuptools.build_meta"

[project]
    name = "dfjsim_shared_tools"
    version = "0.7.0"
    description = "Shared build and runtime helpers for dfjsim Python desktop applications."
    readme = "README.md"
    # MIT from 0.6.0 (GPL-3.0-or-later before). MS-RL covers one file only: wix/MyWixUI_InstallDir.wxs, derived
    # from the WiX Toolset's own dialog set, whose licence travels beside it.
    license = "MIT AND MS-RL"
    license-files = ["LICENSE", "dfjsim_shared_tools/wix/LICENSE-MS-RL.txt"]
    requires-python = ">=3.14,<3.15"
    dependencies = [
        "packaging",
        "pydantic",
    ]

    [project.optional-dependencies]
        # Qt is NOT required to build an installer, so it is not a hard dependency: a consuming
        # project that is not a Qt application would otherwise pull in several hundred MB of Qt for
        # a WiX/Nuitka build helper, and have to tell Nuitka not to bundle it.
        #
        # Nothing in this package imports PySide6 at module level. auto_update imports QMessageBox
        # inside the function that shows the popup, guarded, and falls back to tkinter;
        # qt_auto_compiler only shells out to the `pyside6-uic` executable. So the package imports
        # and works without this extra installed.
        qt = [
            "pyside6",
        ]

    [project.scripts]
        dfjsim-build = "dfjsim_shared_tools.build_nuitka_wix_installer:main"

[tool.uv]
    package = true

[dependency-groups]
    dev = [
        "pytest",
    ]

[tool.setuptools.packages.find]
    where   = ["."]
    include = ["dfjsim_shared_tools*"]

[tool.setuptools.package-data]
    dfjsim_shared_tools = ["wix/*.wxs", "wix/LICENSE-MS-RL.txt"]

[tool.pytest.ini_options]
    testpaths = ["tests"]

[tool.ruff]
    target-version = "py314"
    line-length    = 120
